<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="1000" height="1280" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#E2E8F0"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <marker id="dep" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#475569" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="dep-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-lilac" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>

    <style>
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; filter: url(#shadow); }
      .card-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1.2; filter: url(#shadow); }
      .iface { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .iface-g { fill: #FFFFFF; stroke: #4ADE80; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .fake { fill: #FAF5FF; stroke: #A78BFA; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .leaf { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1; }
      .div { stroke: #E2E8F0; stroke-width: 1; }
      .div-g { stroke: #DCFCE7; stroke-width: 1; }

      .panel { fill: #F1F5F9; fill-opacity: 0.85; stroke: #E2E8F0; stroke-width: 1; }
      .panel-g { fill: #F0FDF4; fill-opacity: 0.9; stroke: #BBF7D0; stroke-width: 1; }

      .dep { stroke: #475569; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#dep); }
      .own { stroke: #16A34A; stroke-width: 2; fill: none; stroke-linecap: round; marker-end: url(#dep-green); }
      .inh { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#inh-green); }
      .impl { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh); }
      .impl-g { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-green); }
      .impl-l { stroke: #8B5CF6; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-lilac); }

      .title { font-size: 14px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .title-g { font-size: 14px; font-weight: 600; fill: #166534; text-anchor: middle; }
      .m { font-size: 12px; fill: #475569; }
      .m-g { font-size: 12px; fill: #15803D; }
      .leaf-t { font-size: 12px; font-weight: 500; fill: #166534; text-anchor: middle; }

      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; text-anchor: middle; }
      .code-g { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #15803D; }
      .code-l { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }

      .badge { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .badge-t { font-size: 10.5px; font-weight: 500; fill: #2563EB; text-anchor: middle; }
      .badge-g { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1; }
      .badge-gt { font-size: 10.5px; font-weight: 500; fill: #15803D; text-anchor: middle; }

      .tag { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .tag-t { font-size: 12px; font-weight: 600; fill: #334155; }
      .tag-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1; }
      .tag-gt { font-size: 12px; font-weight: 600; fill: #15803D; }
      .muted { font-size: 12px; font-weight: 400; fill: #94A3B8; }

      .note { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 1; }
      .note-t { font-size: 11.5px; fill: #92400E; }
      .note-code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #92400E; }
      .note-link { stroke: #F59E0B; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    </style>

    <marker id="ret" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <style>
      .life { stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .msg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#dep); }
      .msg-g { stroke: #16A34A; stroke-width: 1.6; fill: none; marker-end: url(#dep-green); }
      .ret { stroke: #94A3B8; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .alt { fill: none; stroke: #94A3B8; stroke-width: 1.2; }
      .alt-div { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .lbl { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-s { font-size: 11.5px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-n { font-size: 10.5px; fill: #B45309; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .guard { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #475569; }
      .head { font-size: 13.5px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .head-g { font-size: 13.5px; font-weight: 600; fill: #166534; text-anchor: middle; }
      .why-t { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .why-c { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1D4ED8; }
      .why-b { font-size: 12px; fill: #475569; }
      .num { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .num-t { font-size: 12px; font-weight: 700; fill: #2563EB; text-anchor: middle; }
      .bad { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1.2; }
      .bad-t { font-size: 13.5px; font-weight: 600; fill: #B91C1C; text-anchor: middle; }
      .bad-m { font-size: 11.5px; fill: #B91C1C; }
      .cap { font-size: 12px; fill: #64748B; }
      .sub { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .sub-g { font-size: 11px; fill: #4D7C5F; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1000" height="1280" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="22" font-weight="700" fill="#0F172A">Отчёты FleetReports</text>
  <text x="40" y="80" font-size="13" fill="#64748B">Сценарии summary(), beginnerFriendly() и inventory()</text>

  <!-- const& banner -->
  <rect class="note" x="40" y="104" width="920" height="76" rx="12"/>
  <text x="58" y="128" font-size="13.5" font-weight="700" fill="#92400E">Fleet отдаётся только по const&amp;</text>
  <text class="note-t" x="58" y="149">FleetReports(const Fleet&amp;, const BeginnerPolicy&amp;): отчёты только читают парк.</text>
  <text class="note-t" x="58" y="167">vehicles() и items() возвращают vector&lt;const T*&gt; — изменить объекты через отчёты нельзя.</text>

  <!-- ============ summary() ============ -->
  <rect class="panel" x="40" y="205" width="920" height="270" rx="20"/>
  <rect class="tag" x="56" y="219" width="196" height="22" rx="11"/>
  <text x="68" y="234"><tspan class="tag-t" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">summary()</tspan><tspan class="muted" dx="8">→ FleetSummary</tspan></text>

  <rect class="card" x="60" y="260" width="190" height="140" rx="12"/>
  <text class="head" x="155" y="286">FleetReports</text>
  <line class="div" x1="60" y1="300" x2="250" y2="300"/>
  <text class="code-l" x="74" y="322">summary() const</text>
  <text class="m" x="74" y="342">вызывает App</text>

  <line class="dep" x1="250" y1="330" x2="290" y2="330"/>

  <rect class="card-g" x="290" y="260" width="190" height="140" rx="12"/>
  <rect class="badge" x="406" y="251" width="60" height="18" rx="9"/>
  <text class="badge-t" x="436" y="264">const&amp;</text>
  <text class="head-g" x="385" y="286">Fleet</text>
  <line class="div-g" x1="290" y1="300" x2="480" y2="300"/>
  <text class="code-g" x="304" y="322">vehicles()</text>
  <text class="code-g" x="304" y="342">items()</text>
  <text class="m-g" x="304" y="362">→ vector&lt;const T*&gt;</text>

  <line class="dep" x1="480" y1="330" x2="520" y2="330"/>

  <rect class="iface-g" x="520" y="260" width="190" height="140" rx="12"/>
  <rect class="badge-g" x="632" y="251" width="68" height="18" rx="9"/>
  <text class="badge-gt" x="666" y="264">интерфейс</text>
  <text class="head-g" x="615" y="286">IEnergyConsumer</text>
  <line class="div-g" x1="520" y1="300" x2="710" y2="300"/>
  <text class="code-g" x="534" y="322">dynamic_cast&lt;const</text>
  <text class="code-g" x="548" y="340">IEnergyConsumer *&gt;</text>
  <text class="m-g" x="534" y="362" font-size="11.5">успех: += dailyEnergyKwh()</text>
  <text class="m-g" x="534" y="380" font-size="11.5">иначе: пропуск</text>

  <line class="dep" x1="710" y1="330" x2="750" y2="330"/>

  <rect class="card" x="750" y="260" width="190" height="140" rx="12"/>
  <text class="head" x="845" y="286">FleetSummary</text>
  <line class="div" x1="750" y1="300" x2="940" y2="300"/>
  <text class="code-l" x="764" y="322">vehicleCount</text>
  <text class="code-l" x="764" y="340">itemCount</text>
  <text class="code-l" x="764" y="358">dailyEnergyKwh</text>

  <text class="cap" x="60" y="436">Количество — размеры списков; энергия — сумма dailyEnergyKwh() по транспорту и предметам,</text>
  <text class="cap" x="60" y="454">которые являются IEnergyConsumer.</text>

  <!-- ============ beginnerFriendly() ============ -->
  <rect class="panel" x="40" y="495" width="920" height="270" rx="20"/>
  <rect class="tag" x="56" y="509" width="306" height="22" rx="11"/>
  <text x="68" y="524"><tspan class="tag-t" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">beginnerFriendly()</tspan><tspan class="muted" dx="8">→ vector&lt;const Vehicle*&gt;</tspan></text>

  <rect class="card" x="60" y="550" width="190" height="140" rx="12"/>
  <text class="head" x="155" y="576">FleetReports</text>
  <line class="div" x1="60" y1="590" x2="250" y2="590"/>
  <text class="code-l" x="74" y="612">beginnerFriendly() const</text>
  <text class="m" x="74" y="632">вызывает App</text>

  <line class="dep" x1="250" y1="620" x2="290" y2="620"/>

  <rect class="card-g" x="290" y="550" width="190" height="140" rx="12"/>
  <rect class="badge" x="406" y="541" width="60" height="18" rx="9"/>
  <text class="badge-t" x="436" y="554">const&amp;</text>
  <text class="head-g" x="385" y="576">Fleet</text>
  <line class="div-g" x1="290" y1="590" x2="480" y2="590"/>
  <text class="code-g" x="304" y="612">vehicles()</text>
  <text class="m-g" x="304" y="632">→ const Vehicle*</text>

  <line class="dep" x1="480" y1="620" x2="520" y2="620"/>

  <rect class="card" x="520" y="550" width="190" height="140" rx="12"/>
  <text class="head" x="615" y="572">BeginnerPolicy</text>
  <text class="sub" x="615" y="587">simplicity ≥ 6</text>
  <line class="div" x1="520" y1="597" x2="710" y2="597"/>
  <text class="code-l" x="534" y="618">isSuitable(v)</text>
  <text class="m" x="534" y="638">для каждого транспорта</text>

  <line class="dep" x1="710" y1="620" x2="750" y2="620"/>

  <rect class="card" x="750" y="550" width="190" height="140" rx="12"/>
  <text class="head" x="845" y="576">Результат</text>
  <line class="div" x1="750" y1="590" x2="940" y2="590"/>
  <text class="code-l" x="764" y="612">vector&lt;const Vehicle*&gt;</text>
  <text class="m" x="764" y="632">только подходящие</text>
  <text class="m" x="764" y="652">порядок как в Fleet</text>

  <text class="cap" x="60" y="726">Предметы не участвуют: BeginnerPolicy оценивает только Vehicle::simplicity().</text>

  <!-- ============ inventory() ============ -->
  <rect class="panel" x="40" y="785" width="920" height="270" rx="20"/>
  <rect class="tag" x="56" y="799" width="232" height="22" rx="11"/>
  <text x="68" y="814"><tspan class="tag-t" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">inventory()</tspan><tspan class="muted" dx="8">через IInventoriable</tspan></text>

  <rect class="card-g" x="60" y="840" width="190" height="140" rx="12"/>
  <rect class="badge" x="176" y="831" width="60" height="18" rx="9"/>
  <text class="badge-t" x="206" y="844">const&amp;</text>
  <text class="head-g" x="155" y="866">Fleet</text>
  <line class="div-g" x1="60" y1="880" x2="250" y2="880"/>
  <text class="code-g" x="74" y="902">vehicles()</text>
  <text class="code-g" x="74" y="922">items()</text>
  <text class="m-g" x="74" y="942">→ const T*</text>

  <line class="dep" x1="250" y1="910" x2="290" y2="910"/>

  <rect class="card-g" x="290" y="840" width="190" height="140" rx="12"/>
  <text class="head-g" x="385" y="866">IInventoriable</text>
  <line class="div-g" x1="290" y1="880" x2="480" y2="880"/>
  <text class="code-g" x="304" y="902">inventoryNumber()</text>
  <text class="code-g" x="304" y="922">name()</text>
  <text class="m-g" x="304" y="942">общий для Vehicle и Item</text>

  <line class="dep" x1="480" y1="910" x2="520" y2="910"/>

  <rect class="card" x="520" y="840" width="190" height="140" rx="12"/>
  <text class="head" x="615" y="866">Сортировка</text>
  <line class="div" x1="520" y1="880" x2="710" y2="880"/>
  <text class="m" x="534" y="902">по числу номера</text>
  <text class="code-l" x="534" y="922">formatInventoryNumber(n)</text>
  <text class="m" x="534" y="942">→ «ВК-000001»</text>

  <line class="dep" x1="710" y1="910" x2="750" y2="910"/>

  <rect class="card" x="750" y="840" width="190" height="140" rx="12"/>
  <text class="head" x="845" y="866">InventoryLine</text>
  <line class="div" x1="750" y1="880" x2="940" y2="880"/>
  <text class="code-l" x="764" y="902">inventoryNumber</text>
  <text class="code-l" x="764" y="920">name</text>
  <text class="code-l" x="764" y="938">isVehicle</text>

  <text class="cap" x="60" y="1016">Транспорт и предметы читаются через общий интерфейс IInventoriable, поэтому попадают в один список;</text>
  <text class="cap" x="60" y="1034">сортировка — по числу номера, а не по строке.</text>
</svg>
