<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="1000" height="1280" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#E2E8F0"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <marker id="dep" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#475569" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="dep-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-lilac" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>

    <style>
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; filter: url(#shadow); }
      .card-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1.2; filter: url(#shadow); }
      .iface { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .iface-g { fill: #FFFFFF; stroke: #4ADE80; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .fake { fill: #FAF5FF; stroke: #A78BFA; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .leaf { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1; }
      .div { stroke: #E2E8F0; stroke-width: 1; }
      .div-g { stroke: #DCFCE7; stroke-width: 1; }

      .panel { fill: #F1F5F9; fill-opacity: 0.85; stroke: #E2E8F0; stroke-width: 1; }
      .panel-g { fill: #F0FDF4; fill-opacity: 0.9; stroke: #BBF7D0; stroke-width: 1; }

      .dep { stroke: #475569; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#dep); }
      .own { stroke: #16A34A; stroke-width: 2; fill: none; stroke-linecap: round; marker-end: url(#dep-green); }
      .inh { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#inh-green); }
      .impl { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh); }
      .impl-g { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-green); }
      .impl-l { stroke: #8B5CF6; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-lilac); }

      .title { font-size: 14px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .title-g { font-size: 14px; font-weight: 600; fill: #166534; text-anchor: middle; }
      .m { font-size: 12px; fill: #475569; }
      .m-g { font-size: 12px; fill: #15803D; }
      .leaf-t { font-size: 12px; font-weight: 500; fill: #166534; text-anchor: middle; }

      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; text-anchor: middle; }
      .code-g { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #15803D; }
      .code-l { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }

      .badge { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .badge-t { font-size: 10.5px; font-weight: 500; fill: #2563EB; text-anchor: middle; }
      .badge-g { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1; }
      .badge-gt { font-size: 10.5px; font-weight: 500; fill: #15803D; text-anchor: middle; }

      .tag { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .tag-t { font-size: 12px; font-weight: 600; fill: #334155; }
      .tag-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1; }
      .tag-gt { font-size: 12px; font-weight: 600; fill: #15803D; }
      .muted { font-size: 12px; font-weight: 400; fill: #94A3B8; }

      .note { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 1; }
      .note-t { font-size: 11.5px; fill: #92400E; }
      .note-code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #92400E; }
      .note-link { stroke: #F59E0B; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    </style>

    <marker id="ret" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <style>
      .life { stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .msg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#dep); }
      .msg-g { stroke: #16A34A; stroke-width: 1.6; fill: none; marker-end: url(#dep-green); }
      .ret { stroke: #94A3B8; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .alt { fill: none; stroke: #94A3B8; stroke-width: 1.2; }
      .alt-div { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .lbl { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-s { font-size: 11.5px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-n { font-size: 10.5px; fill: #B45309; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .guard { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #475569; }
      .head { font-size: 13.5px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .head-g { font-size: 13.5px; font-weight: 600; fill: #166534; text-anchor: middle; }
      .why-t { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .why-c { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1D4ED8; }
      .why-b { font-size: 12px; fill: #475569; }
      .num { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .num-t { font-size: 12px; font-weight: 700; fill: #2563EB; text-anchor: middle; }
      .bad { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1.2; }
      .bad-t { font-size: 13.5px; font-weight: 600; fill: #B91C1C; text-anchor: middle; }
      .bad-m { font-size: 11.5px; fill: #B91C1C; }
      .cap { font-size: 12px; fill: #64748B; }
      .sub { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .sub-g { font-size: 11px; fill: #4D7C5F; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1000" height="1280" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="22" font-weight="700" fill="#0F172A">Сценарий: приём транспорта</text>
  <text x="40" y="80" font-size="13" fill="#64748B">Порядок inspect и выдачи inventoryNumber</text>

  <!-- ============ Sequence diagram ============ -->
  <rect class="tag" x="40" y="94" width="214" height="22" rx="11"/>
  <text class="tag-t" x="52" y="109">Диаграмма последовательности</text>

  <!-- Lifelines -->
  <line class="life" x1="80" y1="164" x2="80" y2="770"/>
  <line class="life" x1="210" y1="164" x2="210" y2="770"/>
  <line class="life" x1="360" y1="164" x2="360" y2="770"/>
  <line class="life" x1="530" y1="164" x2="530" y2="770"/>
  <line class="life" x1="720" y1="164" x2="720" y2="770"/>
  <line class="life" x1="895" y1="164" x2="895" y2="770"/>

  <!-- Participants -->
  <rect x="20" y="128" width="120" height="36" rx="10" fill="#0F172A"/>
  <text x="80" y="151" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Оператор</text>
  <rect class="card" x="150" y="128" width="120" height="36" rx="10"/>
  <text class="head" x="210" y="151">App</text>
  <rect class="card" x="300" y="128" width="120" height="36" rx="10"/>
  <text class="head" x="360" y="151">VehicleFactory</text>
  <rect class="card" x="470" y="128" width="120" height="36" rx="10"/>
  <text class="head" x="530" y="151">IntakeService</text>
  <rect class="card" x="660" y="128" width="120" height="36" rx="10"/>
  <text class="head" x="720" y="151">ServiceCenter</text>
  <rect class="card-g" x="835" y="128" width="120" height="36" rx="10"/>
  <text class="head-g" x="895" y="151">Fleet</text>

  <!-- Messages before the branch -->
  <line class="msg" x1="80" y1="200" x2="210" y2="200"/>
  <text class="lbl-s" x="145" y="193">вид, параметры</text>

  <line class="msg" x1="210" y1="238" x2="360" y2="238"/>
  <text class="lbl" x="285" y="231">create(kind, params)</text>

  <line class="ret" x1="360" y1="274" x2="210" y2="274"/>
  <text class="lbl" x="285" y="267">unique_ptr&lt;Vehicle&gt;</text>
  <text class="lbl-n" x="285" y="289">inventoryNumber пуст</text>

  <line class="msg" x1="210" y1="322" x2="530" y2="322"/>
  <text class="lbl" x="370" y="315">accept(std::move(vehicle))</text>

  <line class="msg" x1="530" y1="360" x2="720" y2="360"/>
  <text class="lbl" x="625" y="353">inspect(const Vehicle&amp;)</text>

  <line class="ret" x1="720" y1="396" x2="530" y2="396"/>
  <text class="lbl" x="625" y="389">InspectionResult</text>

  <!-- alt frame -->
  <rect class="alt" x="160" y="420" width="815" height="300" rx="6"/>
  <path d="M160,420 h52 v14 l-8,8 h-44 z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <text class="guard" x="172" y="436">alt</text>
  <text class="guard" x="226" y="436">[accepted]</text>

  <line class="msg-g" x1="530" y1="466" x2="895" y2="466"/>
  <text class="lbl" x="712" y="459">addVehicle(std::move(vehicle))</text>

  <path class="msg" d="M895,486 h36 v24 h-34"/>
  <text class="lbl" x="885" y="502" style="text-anchor: end">assignInventoryNumber(n)</text>
  <text class="lbl-n" x="885" y="520" style="text-anchor: end">n = lastNumber_ + 1</text>

  <line class="ret" x1="895" y1="550" x2="530" y2="550"/>
  <text class="lbl" x="712" y="543">"ВК-000001"</text>

  <line class="ret" x1="530" y1="584" x2="210" y2="584"/>
  <text class="lbl" x="370" y="577">{true, "ВК-000001", ""}</text>

  <line class="alt-div" x1="160" y1="604" x2="975" y2="604"/>
  <text class="guard" x="172" y="621">[!accepted]</text>

  <rect class="note" x="470" y="630" width="300" height="42" rx="8"/>
  <text class="note-t" x="482" y="647">vehicle уничтожается вместе с unique_ptr</text>
  <text class="note-t" x="482" y="663">Fleet не вызывается — номер не тратится</text>

  <line class="ret" x1="530" y1="700" x2="210" y2="700"/>
  <text class="lbl" x="370" y="693">{false, "", reason}</text>

  <!-- Answer to the operator -->
  <line class="ret" x1="210" y1="750" x2="80" y2="750"/>
  <text class="lbl-s" x="145" y="743">номер или причина</text>

  <!-- ============ Lifecycle ============ -->
  <rect class="tag" x="40" y="796" width="176" height="22" rx="11"/>
  <text class="tag-t" x="52" y="811">Жизненный цикл объекта</text>

  <rect class="card" x="40" y="845" width="165" height="80" rx="12"/>
  <text class="head" x="122" y="868">Данные</text>
  <line class="div" x1="40" y1="879" x2="205" y2="879"/>
  <text class="m" x="54" y="898">вид + VehicleParams</text>
  <text class="m" x="54" y="915">ввод оператора</text>

  <line class="msg" x1="205" y1="885" x2="265" y2="885"/>
  <text class="lbl" x="235" y="877">create()</text>

  <rect class="card" x="265" y="845" width="200" height="80" rx="12"/>
  <text class="head" x="365" y="868">Объект</text>
  <line class="div" x1="265" y1="879" x2="465" y2="879"/>
  <text class="code-l" x="279" y="898">unique_ptr&lt;Vehicle&gt;</text>
  <text x="279" y="915" font-size="11.5" fill="#B45309">inventoryNumber пуст</text>

  <line class="msg" x1="465" y1="885" x2="525" y2="885"/>
  <text class="lbl" x="495" y="877">accept()</text>

  <polygon points="525,885 585,847 645,885 585,923" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#shadow)"/>
  <text class="code" x="585" y="889">inspect</text>

  <line class="msg-g" x1="615" y1="866" x2="700" y2="848"/>
  <text class="lbl" x="650" y="846">accepted</text>
  <line class="msg" x1="615" y1="904" x2="700" y2="924"/>
  <text class="lbl" x="652" y="934">!accepted</text>

  <rect class="card-g" x="700" y="818" width="260" height="58" rx="12"/>
  <text class="head-g" x="830" y="841">В Fleet</text>
  <text class="m-g" x="830" y="863" text-anchor="middle">номер «ВК-…», владеет Fleet</text>

  <rect class="bad" x="700" y="896" width="260" height="58" rx="12"/>
  <text class="bad-t" x="830" y="919">Уничтожен</text>
  <text class="bad-m" x="830" y="941" text-anchor="middle">~unique_ptr, номер не тратится</text>

  <!-- ============ Why ============ -->
  <rect class="tag" x="40" y="990" width="96" height="22" rx="11"/>
  <text class="tag-t" x="52" y="1005">Почему так</text>

  <rect class="card" x="40" y="1025" width="290" height="165" rx="12"/>
  <circle class="num" cx="70" cy="1053" r="13"/>
  <text class="num-t" x="70" y="1057">1</text>
  <text class="why-t" x="92" y="1058">Номер — только после inspect</text>
  <text class="why-b" x="58" y="1092">Fleet::addVehicle вызывается только</text>
  <text class="why-b" x="58" y="1112">при accepted. Отказ не трогает</text>
  <text class="why-b" x="58" y="1132">lastNumber_, поэтому номера</text>
  <text class="why-b" x="58" y="1152">идут без пропусков.</text>

  <rect class="card" x="360" y="1025" width="290" height="165" rx="12"/>
  <circle class="num" cx="390" cy="1053" r="13"/>
  <text class="num-t" x="390" y="1057">2</text>
  <text class="why-t" x="412" y="1058">IntakeService знает только</text>
  <text class="why-c" x="412" y="1078">IInspectionService</text>
  <text class="why-b" x="378" y="1108">Зависит от интерфейса, а не от</text>
  <text class="why-b" x="378" y="1128">ServiceCenter: правила осмотра</text>
  <text class="why-b" x="378" y="1148">меняются без правки IntakeService,</text>
  <text class="why-b" x="378" y="1168">в тестах подставляется FakeInspection.</text>

  <rect class="card" x="680" y="1025" width="290" height="165" rx="12"/>
  <circle class="num" cx="710" cy="1053" r="13"/>
  <text class="num-t" x="710" y="1057">3</text>
  <text class="why-t" x="732" y="1058">unique_ptr передаёт владение</text>
  <text class="why-b" x="698" y="1092">accept(std::move(vehicle)) забирает</text>
  <text class="why-b" x="698" y="1112">объект целиком. При приёме он</text>
  <text class="why-b" x="698" y="1132">переходит в Fleet, при отказе</text>
  <text class="why-b" x="698" y="1152">уничтожается сам: без утечек</text>
  <text class="why-b" x="698" y="1172">и двойного владения.</text>
</svg>
