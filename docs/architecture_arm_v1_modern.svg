<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="1000" height="1280" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#E2E8F0"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <marker id="dep" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#475569" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="dep-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="inh-lilac" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.5 L11,6 L1,10.5 z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>

    <style>
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; filter: url(#shadow); }
      .card-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1.2; filter: url(#shadow); }
      .iface { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .iface-g { fill: #FFFFFF; stroke: #4ADE80; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .fake { fill: #FAF5FF; stroke: #A78BFA; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .leaf { fill: #DCFCE7; stroke: #86EFAC; stroke-width: 1; }
      .div { stroke: #E2E8F0; stroke-width: 1; }
      .div-g { stroke: #DCFCE7; stroke-width: 1; }

      .panel { fill: #F1F5F9; fill-opacity: 0.85; stroke: #E2E8F0; stroke-width: 1; }
      .panel-g { fill: #F0FDF4; fill-opacity: 0.9; stroke: #BBF7D0; stroke-width: 1; }

      .dep { stroke: #475569; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#dep); }
      .own { stroke: #16A34A; stroke-width: 2; fill: none; stroke-linecap: round; marker-end: url(#dep-green); }
      .inh { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-linecap: round; marker-end: url(#inh-green); }
      .impl { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh); }
      .impl-g { stroke: #16A34A; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-green); }
      .impl-l { stroke: #8B5CF6; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#inh-lilac); }

      .title { font-size: 14px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
      .title-g { font-size: 14px; font-weight: 600; fill: #166534; text-anchor: middle; }
      .m { font-size: 12px; fill: #475569; }
      .m-g { font-size: 12px; fill: #15803D; }
      .leaf-t { font-size: 12px; font-weight: 500; fill: #166534; text-anchor: middle; }

      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; text-anchor: middle; }
      .code-g { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #15803D; }
      .code-l { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }

      .badge { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
      .badge-t { font-size: 10.5px; font-weight: 500; fill: #2563EB; text-anchor: middle; }
      .badge-g { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1; }
      .badge-gt { font-size: 10.5px; font-weight: 500; fill: #15803D; text-anchor: middle; }

      .tag { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .tag-t { font-size: 12px; font-weight: 600; fill: #334155; }
      .tag-g { fill: #FFFFFF; stroke: #86EFAC; stroke-width: 1; }
      .tag-gt { font-size: 12px; font-weight: 600; fill: #15803D; }
      .muted { font-size: 12px; font-weight: 400; fill: #94A3B8; }

      .note { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 1; }
      .note-t { font-size: 11.5px; fill: #92400E; }
      .note-code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #92400E; }
      .note-link { stroke: #F59E0B; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1280" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1000" height="1280" fill="url(#grid)"/>

  <!-- Heading -->
  <text x="40" y="56" font-size="22" font-weight="700" fill="#0F172A">Архитектура АРМ</text>
  <text x="40" y="80" font-size="13" fill="#64748B">Схема компонентов · v1</text>

  <!-- DI ~ main -->
  <rect x="640" y="26" width="80" height="34" rx="17" fill="#0F172A"/>
  <text x="680" y="48" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DI</text>
  <path d="M606,95 q7,-12 14,-8 t14,-8 t14,-8 t14,-8" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>

  <rect class="card" x="430" y="95" width="200" height="70" rx="12"/>
  <text class="title" x="530" y="135" font-size="15">main</text>

  <!-- Legend -->
  <rect class="card" x="740" y="160" width="210" height="112" rx="12"/>
  <text x="756" y="182" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">ОБОЗНАЧЕНИЯ</text>
  <line x1="756" y1="204" x2="800" y2="204" class="dep"/>
  <text class="m" x="812" y="208">зависимость</text>
  <line x1="756" y1="228" x2="800" y2="228" stroke="#475569" stroke-width="1.4" stroke-linecap="round" marker-end="url(#inh)"/>
  <text class="m" x="812" y="232">наследование</text>
  <line x1="756" y1="252" x2="800" y2="252" class="impl"/>
  <text class="m" x="812" y="256">интерфейс</text>

  <!-- App -->
  <line x1="530" y1="165" x2="530" y2="225" class="dep"/>
  <rect class="card" x="430" y="225" width="200" height="80" rx="12"/>
  <text class="title" x="530" y="249" font-size="15">App</text>
  <line class="div" x1="430" y1="261" x2="630" y2="261"/>
  <text class="m" x="446" y="285">• консольный функционал</text>

  <!-- Services panel -->
  <rect class="panel" x="180" y="345" width="760" height="425" rx="20"/>
  <rect class="tag" x="194" y="355" width="112" height="22" rx="11"/>
  <text x="206" y="370"><tspan class="tag-t">services</tspan><tspan class="muted" dx="6">библ.</tspan></text>

  <!-- App dependencies -->
  <line x1="470" y1="305" x2="345" y2="385" class="dep"/>
  <line x1="530" y1="305" x2="530" y2="385" class="dep"/>
  <line x1="610" y1="305" x2="775" y2="385" class="dep"/>
  <rect class="pill" x="415" y="324" width="22" height="18" rx="9"/>
  <text class="code" x="426" y="337">&amp;</text>
  <rect class="pill" x="501" y="319" width="58" height="18" rx="9"/>
  <text class="code" x="530" y="332">const &amp;</text>
  <rect class="pill" x="639" y="324" width="58" height="18" rx="9"/>
  <text class="code" x="668" y="337">const &amp;</text>

  <!-- Intake -->
  <rect class="card" x="225" y="385" width="170" height="100" rx="12"/>
  <text class="title" x="310" y="408">Intake</text>
  <line class="div" x1="225" y1="419" x2="395" y2="419"/>
  <text class="m" x="240" y="439">• register()</text>
  <text class="m" x="240" y="457">• accept()</text>

  <!-- FleetRep. -->
  <rect class="card" x="445" y="385" width="170" height="100" rx="12"/>
  <rect class="badge" x="556" y="376" width="52" height="18" rx="9"/>
  <text class="badge-t" x="582" y="389">чтение</text>
  <text class="title" x="530" y="408">FleetRep.</text>
  <line class="div" x1="445" y1="419" x2="615" y2="419"/>
  <text class="m" x="460" y="439">• summary()</text>
  <text class="m" x="460" y="457">• beginnerFriendly()</text>
  <text class="m" x="460" y="475">• inventory()</text>

  <!-- VehicleFactory -->
  <rect class="card" x="715" y="385" width="190" height="130" rx="12"/>
  <text class="title" x="810" y="405">VehicleFactory</text>
  <text x="810" y="421" font-size="11.5" fill="#64748B" text-anchor="middle">реестр видов</text>
  <line class="div" x1="715" y1="431" x2="905" y2="431"/>
  <text class="m" x="730" y="451">• create()</text>
  <text class="m" x="730" y="469">• types()</text>
  <text class="m" x="730" y="487">• contains()</text>
  <text class="m" x="730" y="505">• registerType()</text>

  <!-- Row 1 -> Row 2 -->
  <line x1="310" y1="485" x2="310" y2="545" class="dep"/>
  <line x1="395" y1="465" x2="475" y2="545" class="dep"/>
  <line x1="530" y1="485" x2="530" y2="545" class="dep"/>
  <line x1="600" y1="485" x2="690" y2="545" class="dep"/>
  <rect class="pill" x="281" y="506" width="58" height="18" rx="9"/>
  <text class="code" x="310" y="519">const &amp;</text>
  <rect class="pill" x="424" y="496" width="22" height="18" rx="9"/>
  <text class="code" x="435" y="509">&amp;</text>
  <rect class="pill" x="501" y="506" width="58" height="18" rx="9"/>
  <text class="code" x="530" y="519">const &amp;</text>
  <rect class="pill" x="616" y="506" width="58" height="18" rx="9"/>
  <text class="code" x="645" y="519">const &amp;</text>

  <!-- Inspection service -->
  <rect class="iface" x="225" y="545" width="170" height="80" rx="12"/>
  <rect class="badge" x="320" y="536" width="68" height="18" rx="9"/>
  <text class="badge-t" x="354" y="549">интерфейс</text>
  <text class="title" x="310" y="568">Inspection service</text>
  <line class="div" x1="225" y1="579" x2="395" y2="579"/>
  <text class="m" x="240" y="599">• inspect()</text>

  <!-- Fleet -->
  <rect class="card-g" x="445" y="545" width="170" height="128" rx="12"/>
  <text class="title-g" x="530" y="565">Fleet</text>
  <text x="530" y="581" font-size="11.5" fill="#4D7C5F" text-anchor="middle">баланс, inventoryNumber</text>
  <line class="div-g" x1="445" y1="591" x2="615" y2="591"/>
  <text class="m-g" x="460" y="611">• addVehicle()</text>
  <text class="m-g" x="460" y="629">• addItem()</text>
  <text class="m-g" x="460" y="647">• vehicles()</text>
  <text class="m-g" x="460" y="665">• items()</text>

  <!-- Fleet note -->
  <line class="note-link" x1="464" y1="690" x2="464" y2="673"/>
  <rect class="note" x="407" y="690" width="113" height="62" rx="8"/>
  <text class="note-code" x="419" y="708">lastNumber_</text>
  <text class="note-t" x="419" y="724">общий для</text>
  <text class="note-t" x="419" y="740">Vehicle и Item</text>

  <!-- Beg. policy -->
  <rect class="card" x="665" y="545" width="160" height="80" rx="12"/>
  <text class="title" x="745" y="565">Beg. policy</text>
  <text x="745" y="581" font-size="11.5" fill="#64748B" text-anchor="middle">simplicity ≥ 6</text>
  <line class="div" x1="665" y1="591" x2="825" y2="591"/>
  <text class="m" x="680" y="611">• isSuitable()</text>

  <!-- ServiceCenter -->
  <line x1="310" y1="672" x2="310" y2="625" class="impl"/>
  <rect class="card" x="225" y="672" width="170" height="52" rx="12"/>
  <text class="title" x="310" y="703">ServiceCenter</text>

  <!-- Fake Inspection -->
  <rect class="fake" x="24" y="545" width="126" height="80" rx="12"/>
  <text x="87" y="590" font-size="13" font-weight="600" fill="#6D28D9" text-anchor="middle">Fake Inspection</text>
  <line x1="150" y1="585" x2="225" y2="585" class="impl-l"/>

  <!-- Ownership: Fleet -> Equipment -->
  <line x1="530" y1="673" x2="530" y2="815" class="own"/>
  <rect class="tag-g" x="542" y="688" width="142" height="62" rx="10"/>
  <text class="tag-gt" x="554" y="706">Владение</text>
  <text class="code-g" x="554" y="723">un. ptr &lt;Vehicle&gt;</text>
  <text class="code-g" x="554" y="739">un. ptr &lt;Item&gt;</text>

  <!-- VehicleFactory -> Equipment -->
  <line x1="880" y1="515" x2="880" y2="815" class="dep"/>
  <rect class="tag" x="714" y="666" width="156" height="44" rx="10"/>
  <text class="tag-t" x="726" y="684">create</text>
  <text class="code-l" x="726" y="700">unique_ptr&lt;Vehicle&gt;</text>

  <!-- Equipment panel -->
  <rect class="panel-g" x="180" y="815" width="760" height="440" rx="20"/>
  <rect class="tag-g" x="194" y="825" width="92" height="22" rx="11"/>
  <text class="tag-gt" x="206" y="840">Equipment</text>

  <!-- IInventoriable -->
  <rect class="card-g" x="445" y="850" width="190" height="80" rx="12"/>
  <text class="title-g" x="540" y="873">IInventoriable</text>
  <line class="div-g" x1="445" y1="884" x2="635" y2="884"/>
  <text class="m-g" x="460" y="903">• name</text>
  <text class="m-g" x="460" y="921">• number</text>

  <!-- Notes -->
  <rect class="note" x="194" y="860" width="236" height="46" rx="8"/>
  <text class="note-t" x="206" y="879">Конструкторы проверяют параметры</text>
  <text class="note-code" x="206" y="896">ошибка → invalid_argument</text>

  <line class="note-link" x1="664" y1="898" x2="635" y2="917"/>
  <rect class="note" x="660" y="852" width="262" height="46" rx="8"/>
  <text class="note-t" x="672" y="871">inventoryNumber пуст, пока объект</text>
  <text class="note-t" x="672" y="888">не на балансе (Fleet)</text>

  <!-- Vehicle -->
  <line x1="385" y1="995" x2="470" y2="930" class="inh"/>
  <rect class="card-g" x="265" y="975" width="120" height="116" rx="12"/>
  <text class="title-g" x="325" y="998">Vehicle</text>
  <line class="div-g" x1="265" y1="1009" x2="385" y2="1009"/>
  <text class="m-g" x="278" y="1028">• title(kind)</text>
  <text class="m-g" x="278" y="1046">• nickname</text>
  <text class="m-g" x="278" y="1064">• simple</text>
  <text class="m-g" x="278" y="1082">• wear</text>

  <!-- Item -->
  <line x1="730" y1="965" x2="615" y2="930" class="inh"/>
  <rect class="card-g" x="700" y="965" width="110" height="55" rx="12"/>
  <text class="title-g" x="755" y="997">Item</text>

  <!-- Energy consumer -->
  <rect class="iface-g" x="465" y="1060" width="140" height="60" rx="12"/>
  <rect class="badge-g" x="530" y="1051" width="68" height="18" rx="9"/>
  <text class="badge-gt" x="564" y="1064">интерфейс</text>
  <text class="title-g" x="535" y="1083" font-size="13">Energy consumer</text>
  <line class="div-g" x1="465" y1="1092" x2="605" y2="1092"/>
  <text class="m-g" x="478" y="1110">• d. EnergyKwh</text>

  <!-- El. Item -->
  <line x1="705" y1="1065" x2="738" y2="1020" class="inh"/>
  <line x1="640" y1="1088" x2="605" y2="1088" class="impl-g"/>
  <rect class="card-g" x="640" y="1065" width="85" height="45" rx="12"/>
  <text class="title-g" x="682" y="1092" font-size="13">El. Item</text>

  <!-- helmet -->
  <line x1="785" y1="1085" x2="785" y2="1020" class="inh"/>
  <rect class="leaf" x="753" y="1085" width="64" height="30" rx="15"/>
  <text class="leaf-t" x="785" y="1104">helmet</text>

  <!-- Vehicle subclasses -->
  <line x1="233" y1="1130" x2="285" y2="1091" class="inh"/>
  <rect class="leaf" x="189" y="1130" width="72" height="30" rx="15"/>
  <text class="leaf-t" x="225" y="1149">Scooter</text>

  <line x1="320" y1="1130" x2="320" y2="1091" class="inh"/>
  <rect class="leaf" x="285" y="1130" width="70" height="30" rx="15"/>
  <text class="leaf-t" x="320" y="1149">Bicycle</text>

  <line x1="402" y1="1130" x2="368" y2="1091" class="inh"/>
  <line x1="440" y1="1132" x2="488" y2="1120" class="impl-g"/>
  <rect class="leaf" x="375" y="1130" width="70" height="30" rx="15"/>
  <text class="leaf-t" x="410" y="1149">Electric</text>

  <line x1="372" y1="1200" x2="398" y2="1160" class="inh"/>
  <rect class="leaf" x="322" y="1200" width="86" height="30" rx="15"/>
  <text class="leaf-t" x="365" y="1219">El. scooter</text>

  <line x1="458" y1="1200" x2="424" y2="1160" class="inh"/>
  <rect class="leaf" x="423" y="1200" width="84" height="30" rx="15"/>
  <text class="leaf-t" x="465" y="1219">El. bicycle</text>

  <!-- El. Item subclasses -->
  <line x1="608" y1="1175" x2="662" y2="1110" class="inh"/>
  <rect class="leaf" x="549" y="1175" width="92" height="30" rx="15"/>
  <text class="leaf-t" x="595" y="1194">Dock Station</text>

  <line x1="706" y1="1175" x2="700" y2="1110" class="inh"/>
  <rect class="leaf" x="660" y="1175" width="100" height="30" rx="15"/>
  <text class="leaf-t" x="710" y="1194">Charging cab.</text>
</svg>
